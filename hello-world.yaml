# A minimal "hello world" to prove the cluster works.
# Apply:  kubectl apply -f hello-world.yaml
# Then:   kubectl get pods -o wide   (shows which worker it landed on)
apiVersion: v1
kind: Pod
metadata:
  name: hello-world
  labels:
    app: hello-world
spec:
  containers:
    - name: hello
      image: nginxdemos/hello:plain-text
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
spec:
  type: NodePort
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081   # reach it at http://<any-node-ip>:30081
